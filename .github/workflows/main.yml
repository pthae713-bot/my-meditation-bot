name: Auto Post Meditation
on:
  schedule:
    - cron: '0 22 * * *' 
    - cron: '0 10 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            /var/cache/apt
            node_modules
          key: ${{ runner.os }}-cache-${{ hashFiles('package-lock.json') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Workflow
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RUN_WORKFLOW: 'true'
        run: node bot.js

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs/
          git commit -m "Remove processed song and sync new ones" || exit 0
          git push