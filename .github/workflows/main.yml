name: Auto Post Meditation
on:
  schedule:
    - cron: '0 22 * * *' 
    - cron: '0 10 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # Libraries တွေကို သိမ်းထားရန် (ဒါက အချိန်အများကြီး သက်သာစေပါမယ်)
      - name: Cache System Dependencies
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          # မရှိမဖြစ်လိုအပ်တာတွေကိုပဲ သွင်းပြီး ကျန်တာကို skip လုပ်ခိုင်းထားပါတယ်
          sudo apt-get install -y -qq --no-install-recommends build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install
          # Canvas error ကို ပြင်ရန်အတွက် အောက်ပါ line ကို သုံးရပါမယ်
          npm rebuild canvas --update-binary

      - name: Run Workflow
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RUN_WORKFLOW: 'true'
        run: node bot.js

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs/
          git commit -m "Remove processed song and sync new ones" || exit 0
          git push